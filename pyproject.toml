[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-llm-gateway"
version = "0.1.0"
description = "Production-grade, resilient, self-healing LLM API Gateway with circuit breakers, sliding window health, backoff queueing, and Prometheus observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "litellm>=1.35.0",
    "redis[hiredis]>=5.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
